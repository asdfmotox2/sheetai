[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheetai"
version = "0.1.0"
description = "Process spreadsheet rows through LLM APIs. Feed CSV/Excel, get structured AI-enriched output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Anthony Hadding", email = "asdfmotox2@gmail.com" }]
keywords = ["ai", "csv", "excel", "llm", "claude", "openai", "data-processing", "spreadsheet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "anthropic>=0.30.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[project.scripts]
sheetai = "sheetai.cli:main"

[project.urls]
Homepage = "https://github.com/asdfmotox2/sheetai"
Issues = "https://github.com/asdfmotox2/sheetai/issues"
